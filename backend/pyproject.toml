[project]
name = "pasazhgard"
version = "0.1.0"
description = "Pasazhgard backend: ingest and API"
authors = [
    { name = "Bahador Rousta", email = "bahador.jorshary@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.158.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
